        tech: ['Python', 'MySQL', 'SQL', 'CLI', 'Database Design'],
        description: 'A collection of Python projects including Advanced Library Management CLI, Student Management System, Quiz App Database Design, Hospital Management System DB Design, and Contact Book Management System. These projects demonstrate proficiency in database design, SQL querying, and Python-based CLI application development.',

    const params = new URLSearchParams(window.location.search);
    const projectKey = params.get('project');

    if (projectKey && projectsData[projectKey]) {
      const project = projectsData[projectKey];
      document.title = project.title + ' — Meherun Nessa Ferdausi';
      document.getElementById('projectHero').innerHTML = '<img src="' + project.image + '" alt="' + project.title + '" style="width:100%;height:100%;object-fit:cover;">';
      document.getElementById('projectTitle').textContent = project.title;
      document.getElementById('projectDescription').textContent = project.description;
      document.getElementById('projectLive').href = project.live;
      document.getElementById('projectGithub').href = project.github;

      if (project.live === '#') {
        const liveBtn = document.getElementById('projectLive');
        liveBtn.style.opacity = '0.5';
        liveBtn.style.pointerEvents = 'none';
        liveBtn.title = 'Live demo not yet available';
      }

      document.getElementById('projectTech').innerHTML = project.tech
        .map(t => '<span class="tech-tag">' + t + '</span>').join('');

      document.getElementById('projectChallenges').innerHTML = project.challenges
        .map(c => '<li>' + c + '</li>').join('');

      document.getElementById('projectImprovements').innerHTML = project.improvements
        .map(i => '<li>' + i + '</li>').join('');
    } else {
      document.getElementById('projectTitle').textContent = 'Project Not Found';
      document.getElementById('projectDescription').textContent = 'The project you are looking for does not exist. Please go back to the projects page.';
      document.querySelector('.project-detail-links').style.display = 'none';
    }
  </script>
